name: Deploy to Production
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: production-deploy
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.12"
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django tests
        working-directory: crinkle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python manage.py test
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
      - name: Add server to known_hosts
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy to VM
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${PROD_USER}@${PROD_HOST}" \
            "export GEMINI_API_KEY='${GEMINI_API_KEY}'; bash -se" <<'EOF'
            set -euo pipefail
            cd ~/dev4_cust6
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            python crinkle/manage.py migrate
            python crinkle/manage.py load_prices_from_api
            python crinkle/manage.py collectstatic --noinput
            sudo systemctl restart crinkle
          EOF
      - name: Health check
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if curl -fsSL https://crinkle.ink >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after multiple attempts"
          exit 1
