name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: crinkle
        run: |
          python manage.py test
          python manage.py behave

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add server to known_hosts
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ vars.PROD_PORT }}
        run: |
          mkdir -p ~/.ssh
          PORT="${PROD_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Ensure app directory exists
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
        run: |
          PORT="${PROD_PORT:-22}"
          ssh -p "$PORT" "${PROD_USER}@${PROD_HOST}" "mkdir -p '${PROD_APP_DIR}'"

      - name: Sync repo to server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
        run: |
          PORT="${PROD_PORT:-22}"

          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "venv/" \
            --exclude "__pycache__/" \
            --exclude "*.pyc" \
            --exclude ".coverage" \
            --exclude "crinkle/media/" \
            --exclude "crinkle/staticfiles/" \
            -e "ssh -p $PORT" \
            ./ "${PROD_USER}@${PROD_HOST}:${PROD_APP_DIR}/"

      - name: Install deps, migrate, collect static, restart app
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ vars.PROD_PORT }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
          PROD_SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME }}
        run: |
          PORT="${PROD_PORT:-22}"
          SERVICE_NAME="${PROD_SERVICE_NAME:-crinkle}"

          ssh -p "$PORT" "${PROD_USER}@${PROD_HOST}" <<EOF
            set -e
            cd "${PROD_APP_DIR}"

            python3 -m venv .venv
            . .venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            cd crinkle
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            sudo systemctl restart "${SERVICE_NAME}"
            # If you use supervisor instead of systemd, replace the line above with:
            # sudo supervisorctl restart ${SERVICE_NAME}
          EOF

      - name: Health check
        run: curl -fL https://crinkle.ink/
