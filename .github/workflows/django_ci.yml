name: Django CI

on:
  push: # on any push test
  pull_request: # test on pull request to main branch
    branches: [ "main" ] 

# Minimum permissions required by skip-duplicate-actions
permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  check-duplicate:
    # First thing if there are any duplicate actions skip them
    # otherwise it runs twice on pull requests
    runs-on: ubuntu-latest

    # Track should skip status
    outputs:
      should_skip: ${{ steps.skip-check.outputs.should_skip }}

    steps:
    - id: skip-check
      uses: fkirc/skip-duplicate-actions@v5.3.1
      with:
        #concurrent_skipping: 'same_content_newer' - removed because it always needs to execute
        concurrent_skipping: 'same_content'
        do_not_skip: '["pull_request"]'


  test-and-coverage:
    needs: check-duplicate
    # if no duplicate actions are occuring then run tests and coverage
    if: needs.check-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        cd crinkle
        coverage run manage.py test
        coverage run -a manage.py behave
        coverage report -m --fail-under=80

    - name: Attach Coverage To Pull Request
      if: github.event_name == 'pull_request'
      run: |
        cd crinkle
        echo "## Coverage Report" > report.md
        echo "\`\`\`" >> report.md
        coverage report -m --fail-under=80 >> report.md
        echo "\`\`\`" >> report.md
    
    # Upload code coverage to pull request.
    - name: Upload Report Artifact
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifact
        path: |
          report.md
    
    # Then clean up any generated files
    - name: Cleanup Generated Report
      if: github.event_name == 'pull_request'
      run: rm report.md