name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-code-review:

    # Specify running environment and python version
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    # Check out repo using depth of 2 to get previous for diff
    - name: Checkout repos
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Setup our python instance for the version we use (3.12)
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    # Install project dependencies and openai/PyGithub
    - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install openai PyGithub

    # Obtain the diff and store it with the ai review script in diff.txt
    - name: Get PR Diff
      run: |
        git fetch
        git diff origin/${{ github.event.pull_request.base.ref }} > scripts/diff.txt

    # Run the actual ai review
    - name: Run AI Review
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd scripts
        python ai_review.py

    # Upload result generated from ai_review.py
    - name: Upload Review Artifact
      uses: actions/upload-artifact@v4
      with:
        name: review-artifacts
        path: |
          scripts/feedback.md

    # Attach feedback in comment to the pull request made to main
    - name: Attach Feedback to Pull Request
      uses: thollander/actions-comment-pull-request@v3.0.1
      with:
        file-path: feedback.md

    - name: Cleanup generated files
      run: rm scripts/diff.txt scripts/feedback.md