{% extends "cards/base.html" %}
{% load static %}

{% block top_bar %}
<a class="back-btn" href="{% url 'profile' %}"> ‹ </a>
<span class="screen-title"> My Collection </span>
{% endblock %}

{% block content %}
<form method="get">
    <select id='order' name="order" class="select-order">
        <option value="grade"> Grade </option>
        <option value="name"> Name </option>
        <option value="date"> Date </option>
        <option value="grade-dsc"> Grade Descending </option>
        <option value="grade-dsc"> Name Descending </option>
        <option value="grade-dsc"> Date Descending </option>
    </select>
    <input type="submit" class="submit-btn" value="Sort Collection">
<form>

<div class="card-collection">
    {% for card in cards %}
    
    <div class="card-panel">
        <img src="{{card.picture_path}}" class="card-thumbnail">

        <div class="card-info">
            <p class="card-info"> {{card.name}} </p>
            <p class="card-info"> {{card.grading_notes.grade}} </p>
            <p class="card-info"> {{card.date_scanned}} </p>
            <a href="{% url 'cards:collection' %}{{card.pk}}/"> View/Edit Notes</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
