{% extends "cards/base.html" %}
{% load static %}

{% block top_bar %}
<a class="back-btn" href="{% url 'cards:collection' %}"> ‹ </a>
<span class="screen-title"> Card View </span>
{% endblock %}

{% block content %}
<img src="{{card.picture_path}}" style="max-width:75vw; max-height:50vh; border-radius:12px;">

<form method="post" class="form-group" action="{% url 'card:collection' %}{{card.pk}}/save">
    {% csrf_token %}

    <div class="card-collection">

        <textarea value="{{card.user_notes}}" class="notes-area" name="user_notes" maxlength="300"> </textarea>

        <input type="submit" value="Save" class="save-btn">
    </div>
<form>
{% endblock %}
