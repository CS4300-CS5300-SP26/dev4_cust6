{% extends "cards/base.html" %}

{% block top_bar %}
<a class="back-btn" href="{% url 'cards:collection' %}"> ‹ </a>
<span class="screen-title"> Card View </span>
{% endblock %}

{% block content %}
<img src="{{ picture_path }}" alt="Saved card" style="max-width:75vw; max-height:50vh; border-radius:12px;">

<form method="post" class="form-group" action="{% url 'cards:save_card' id %}">
    {% csrf_token %}
    <div class="card-collection">
        <textarea class="notes-area" name="user_notes" maxlength="300">{{ user_notes }}</textarea>
        <input type="submit" value="Save Notes" class="save-btn">
    </div>
</form>

<form method="post" class="form-group" action="{% url 'cards:delete_card' id %}" style="margin-top:12px;">
    {% csrf_token %}
    <div class="card-collection">
        <button type="submit" class="save-btn">Delete Card</button>
    </div>
</form>
{% endblock %}
