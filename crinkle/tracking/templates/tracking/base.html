{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jersey+10&family=Lato:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link rel="stylesheet" href="{% static 'tracking/css/base.css' %}">
    <title>{% block title %}Crinkle{% endblock %}</title>
</head>
<body>
    <header class="top-bar">
        <div>
            {% block header_left %}
            <a href="/" class="brand">Crinkle</a>
            {% endblock %}
        </div>
        <div>
            {% block header_right %}{% endblock %}
        </div>
    </header>

    {% if messages %}
    <div class="flash-messages">
        {% for message in messages %}
        <div class="flash flash-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
