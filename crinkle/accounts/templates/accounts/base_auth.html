{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jersey+10&family=Lato:wght@500&display=swap" rel="stylesheet">
    <title>{% block title %}Crinkle{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: #F9FAFB;
            color: #101828;
            /* Prevent iOS text size adjustment */
            -webkit-text-size-adjust: 100%;
        }

        /* ── Mobile shell: full screen, no scroll bounce ── */
        .app-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: #F9FAFB;
        }

        /* ── Top bar ── */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 16px 20px 12px;
            background: #fff;
            border-bottom: 1px solid #F2F4F7;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .top-bar .back-btn {
            font-size: 22px;
            color: #344054;
            text-decoration: none;
            margin-right: 12px;
            line-height: 1;
        }
        .top-bar .screen-title {
            font-family: 'Jersey 10', cursive;
            font-size: 22px;
            color: #101828;
        }

        /* ── Scrollable content area ── */
        .screen-body {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px 100px; /* bottom padding for nav bar */
        }

        /* ── Form styles ── */
        .screen-heading {
            font-family: 'Lato', sans-serif;
            font-size: 24px;
            font-weight: 500;
            color: #101828;
            margin-bottom: 6px;
        }
        .screen-subheading {
            font-size: 14px;
            color: #667085;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #344054;
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            height: 52px; /* large tap target */
            padding: 0 16px;
            border: 1.5px solid #D0D5DD;
            border-radius: 12px;
            font-size: 16px; /* 16px prevents iOS zoom on focus */
            font-family: 'Inter', sans-serif;
            color: #101828;
            background: #fff;
            outline: none;
            -webkit-appearance: none;
            transition: border-color 0.15s;
        }
        .field input:focus {
            border-color: #2C4BFB;
        }
        .field-error {
            font-size: 12px;
            color: #D9111D;
            margin-top: 5px;
        }

        /* ── Messages ── */
        .msg-error {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #D9111D;
            margin-bottom: 16px;
        }
        .msg-success {
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #166534;
            margin-bottom: 16px;
        }

        /* ── Primary button ── */
        .btn-primary {
            width: 100%;
            height: 56px;
            background: #2C4BFB;
            color: #fff;
            border: none;
            border-radius: 16px;
            font-family: 'Jersey 10', cursive;
            font-size: 22px;
            cursor: pointer;
            margin-top: 8px;
            letter-spacing: 0.5px;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .btn-primary:active { background: #1a38e0; }

        /* ── Secondary / ghost button ── */
        .btn-ghost {
            width: 100%;
            height: 52px;
            background: transparent;
            color: #667085;
            border: 1.5px solid #D0D5DD;
            border-radius: 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: border-color 0.15s;
        }
        .btn-ghost:active { border-color: #667085; }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0;
            font-size: 13px;
            color: #98A2B3;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E4E7EC;
        }

        /* ── Footer link ── */
        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #667085;
        }
        .footer-link a {
            color: #2C4BFB;
            font-weight: 500;
            text-decoration: none;
        }

        /* ── Bottom nav bar (matches mockup) ── */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 72px;
            background: #fff;
            border-top: 1px solid #F2F4F7;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: env(safe-area-inset-bottom); /* iPhone notch */
            z-index: 20;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #98A2B3;
            font-size: 11px;
            font-weight: 500;
            -webkit-tap-highlight-color: transparent;
            flex: 1;
            padding: 8px 0;
        }
        .nav-item.active { color: #2C4BFB; }
        .nav-item svg { width: 24px; height: 24px; }

        /* SCAN button — center prominent button */
        .nav-item.scan-btn {
            position: relative;
            top: -16px;
        }
        .nav-item.scan-btn .scan-circle {
            width: 56px;
            height: 56px;
            background: #2C4BFB;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(44, 75, 251, 0.4);
        }
        .nav-item.scan-btn svg { color: #fff; width: 26px; height: 26px; }
        .nav-item.scan-btn span { color: #2C4BFB; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
<div class="app-shell">

    <!-- Top bar -->
    <div class="top-bar">
        <a class="back-btn" href="{% url 'index' %}">‹</a>
        <span class="screen-title">{% block screen_title %}Crinkle{% endblock %}</span>
    </div>

    <!-- Main content -->
    <div class="screen-body">
        {% if messages %}
            {% for message in messages %}
                <div class="msg-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <!-- Bottom nav bar (matches mockup) -->
    <nav class="bottom-nav">
        <a class="nav-item {% block nav_home %}{% endblock %}" href="{% url 'index' %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M3 12l2-2m0 0l7-7 7 7m-9 9V9m4 12V9"/>
            </svg>
            <span>Home</span>
        </a>

        <a class="nav-item scan-btn" href="{% url 'cards:scan_report' %}">
            <div class="scan-circle">
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M3 9V6a1 1 0 011-1h3M3 15v3a1 1 0 001 1h3m12-8V6a1 1 0 00-1-1h-3m4 9v3a1 1 0 01-1 1h-3"/>
                </svg>
            </div>
            <span>Scan</span>
        </a>

        <a class="nav-item {% block nav_user %}{% endblock %}" href="{% url 'profile' %}">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span>Account</span>
        </a>
    </nav>

</div>
</body>
</html>
